schema_version: 2
rule_version: "2026-11-26"
scope: "当前全部启用招式，新增或修改招式时一并维护；原始 v2-招式.md 保留供以后补充"
editing: "可直接修改、批注本表供后续调整。游戏当前读取 rules/catalog.js；修改本表后须同步代码。启动和测试不会自动覆盖本文件。"
classification:
  is_spell: "仅 category=spell 的纯法术/辅助行动为真；攻击即使含独立法术或命中效果组件也为假，此分类不删除其法术组件。"
  spell_cancellation: "锤锤锤只取消本回合新施放的普通独立法术及其招式库存收益；固有防护、旧状态、攻击伤害和命中回调保留。"
  actual_cost_membership: "元素盾和刀点刀检查实际库存成本键，不把计算资源价值时的递归展开另算作实际 B/Z/F/Y/S/C 成本。"
