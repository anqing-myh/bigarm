# 大臂招式清单：is_spell 是供人工审阅的法术分类。
# 本表不随启动/测试自动覆盖；新增机制和招式须同步维护。
schema_version: 3
rule_version: "2026-11-26-v3"
scope: "全部已登记招式；implementation_status=ready 才能选用，pending_confirmation 表示等待规则确认。新增或修改招式时一并维护；原始 V2/V3 文件保留供以后补充。"
editing: "可直接修改、批注本表供后续调整。游戏当前读取 rules/catalog.js；修改本表后须同步代码。启动和测试不会自动覆盖本文件。"
classification:
  is_spell: "仅 category=spell 的纯法术/辅助行动为真；攻击即使含独立法术或命中效果组件也为假，此分类不删除其法术组件。"
  spell_cancellation: "锤锤锤只取消本回合新施放的普通独立法术及其招式库存收益；固有防护、旧状态、攻击伤害和命中回调保留。"
  actual_cost_membership: "元素盾和刀点刀检查实际库存成本键，不把计算资源价值时的递归展开另算作实际 B/Z/F/Y/S/C 成本。"
  basic_resource_aliases:
    B: "大臂"
    Z: "攒"
    F: "方盾"
    Y: "圆盾"
    S: "闪"
    C: "超闪"
    Q: "祝福值"
  recurring_status_start_offset:
    default: 1
    ghostDodge: 0
    chainDodge: 0
    voidDodge: 0
damage_pipeline:
  - "clash"
  - "air"
  - "ordinary_immunity"
  - "guard"
  - "himalaya_first_hit_segment"
  - "held_shields_including_plastic"
  - "sky_heal_transfer"
  - "per_event_integer_blessing"
  - "curse_multiplier"
  - "immediate_hp_loss"
  - "immediate_capped_drain"
  - "on_hit_callback"
